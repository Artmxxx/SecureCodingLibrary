name: Security Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # 1. SAST (Static Analysis)
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v3
      - name: Run Semgrep
        # Generate BOTH console output (for screenshots) AND JSON (for artifacts)
        run: semgrep scan --config auto --error --text --json -o semgrep-results.json .
        continue-on-error: true # Don't fail build yet, we want to see results
      
      - name: Upload Semgrep JSON
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # 2. SCA (Software Composition Analysis)
  sca:
    name: SCA - Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm install
          npm audit --audit-level=high --json > ../npm-audit-backend.json || true
          
      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm install
          npm audit --audit-level=high --json > ../npm-audit-frontend.json || true
          
      - name: Upload SCA Reports
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: npm-audit-*.json

  # 3. Secret Scanning
  trufflehog:
    name: Secret Scanning - TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required for history scanning
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified --no-verification
        continue-on-error: true

  # 4. IaC Scanning (Infrastructure as Code)
  checkov:
    name: IaC - Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,secrets
          output_format: cli,json
          output_file_path: console,checkov-report.json
        continue-on-error: true
      
      - name: Upload IaC Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

  # 5. DAST (Dynamic Analysis) - Advanced
  # This spins up the app and scans it. 
  zap_scan:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [semgrep] # Run after SAST to save time if SAST fails heavily
    steps:
      - uses: actions/checkout@v3
      
      # We need to run the app for DAST to work
      - name: Start Containers
        run: |
          docker compose up -d --build
          sleep 30 # Wait for DB and Servers to init
          
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false 
        continue-on-error: true
